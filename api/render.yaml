services:
  - type: web
    name: analyzer-lab-edustudio
    runtime: python
    region: frankfurt  # más cerca de España
    plan: starter      # free tier tiene timeout de 60s — usar starter para vídeos largos
    buildCommand: pip install -e .
    startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false   # se rellena manualmente en el dashboard de Render
      - key: HF_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health
