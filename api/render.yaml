services:
  - type: web
    name: analyzer-lab-edustudio
    runtime: python
    region: frankfurt  # más cerca de España
    plan: starter      # free tier tiene timeout de 60s — usar starter para vídeos largos
    buildCommand: pip install -e .
    startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false   # postgresql://... de Supabase
      - key: S3_ENDPOINT_URL
        sync: false   # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_PUBLIC_URL
        sync: false   # igual que S3_ENDPOINT_URL en R2
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: videos
    healthCheckPath: /health
