services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "10.0.0.4:9000:9000"
      - "10.0.0.4:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/videos &&
        mc anonymous set none local/videos &&
        echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "10.0.0.4:8001:8000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://analyzer.ailumtech.com}
      DATABASE_URL: postgresql://analyzer:${POSTGRES_PASSWORD}@postgres:5432/analyzer
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://s3-analyzer.ailumtech.com}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: videos
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:?Set MODAL_TOKEN_ID in .env}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:?Set MODAL_TOKEN_SECRET in .env}
      USE_MODAL_GPU: ${USE_MODAL_GPU:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.prod
    ports:
      - "10.0.0.4:3007:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
